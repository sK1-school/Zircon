name: Server baseline build

on:
  pull_request:
    branches: [master]
    paths:
      - 'ServerCore/**'
      - 'ServerLibrary/**'
      - 'LibraryCore/**'
      - 'global.json'
      - 'NuGet.Config'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - '.github/workflows/server-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Console server / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record SDK
        run: dotnet --info
      - name: Restore console server
        run: dotnet restore ServerCore/ServerCore.csproj
      - name: Build console server
        run: dotnet build ServerCore/ServerCore.csproj --configuration Release --no-restore
